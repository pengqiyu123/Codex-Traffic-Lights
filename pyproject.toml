[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-traffic-lights"
version = "0.5.0"
description = "Windows 桌面悬浮 VSCode Codex 状态指示灯组件"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Codex Traffic Lights Team"},
]

dependencies = [
    "PyQt5>=5.15.10",
    "psutil>=5.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pyinstaller>=6.0",
]

[project.scripts]
codex-traffic-lights = "codex_traffic_lights.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=.pytest-tmp"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
